name: Sync Codeforces solutions (cloud)

# Cloud runs in placeholder mode -- Codeforces API never returns source code
# and GitHub's runner cannot see your local solutions folder. Run
# local_sync.bat / orchestrator.py locally to upgrade placeholders with real
# source code.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Configure git author
        run: |
          git config user.name "streak-bot"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Run orchestrator
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_SECRET: ${{ secrets.CF_API_SECRET }}
        run: python orchestrator.py
